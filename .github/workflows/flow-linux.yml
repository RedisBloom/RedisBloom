name: Flow Linux

permissions:
  id-token: write
  contents: read
  actions: read
  packages: read

on:
  workflow_dispatch:
    inputs:
      redis-ref:
        description: 'Redis ref to checkout'
        type: string
        required: true
      arch:
        description: 'Architecture (x64 or arm64)'
        type: string
        required: true
        default: 'x64'
      os:
        description: 'OS to build on (space-separated, e.g. "jammy noble resolute rocky10")'
        type: string
        required: false
        default: ''
      run_valgrind:
        description: 'Run valgrind on the tests'
        type: boolean
        default: false
      run_sanitizer:
        description: 'Run sanitizer on the tests'
        type: boolean
        default: false
      use_prebuilt_images:
        description: 'Pull prebuilt Docker images instead of building locally'
        type: boolean
        default: true
      beta-version:
        description: 'Beta version for S3 uploads'
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      redis-ref:
        description: 'Redis ref to checkout'
        type: string
        required: true
      arch:
        description: 'Architecture (x64 or arm64)'
        type: string
        required: true
      os:
        description: 'OS to build on (space-separated, e.g. "jammy noble resolute rocky10")'
        type: string
        required: false
        default: ''
      run_valgrind:
        description: 'Run valgrind on the tests'
        type: boolean
        default: false
      run_sanitizer:
        description: 'Run sanitizer on the tests'
        type: boolean
        default: false
      use_prebuilt_images:
        description: 'Pull prebuilt Docker images instead of building locally'
        type: boolean
        default: true
      beta-version:
        description: 'Beta version for S3 uploads'
        type: string
        required: false
        default: ''

jobs:
  setup-environment:
    runs-on: ubuntu-latest
    outputs:
      redis-ref: ${{ steps.set-env.outputs.redis-ref }}
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      runner: ${{ steps.set-runner.outputs.runner }}
      TAGGED: ${{ steps.set-env.outputs.TAGGED }}
      TAG: ${{ steps.set-env.outputs.TAG }}
      BRANCH: ${{ steps.set-env.outputs.BRANCH }}
      TAG_OR_BRANCH: ${{ steps.set-env.outputs.TAG }}${{ steps.set-env.outputs.BRANCH }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: set env
        id: set-env
        uses: ./.github/actions/setup-env
        with:
          github-ref: ${{ github.ref }}
          redis-ref: ${{ inputs.redis-ref }}
          beta-version: ${{ inputs.beta-version }}
      - name: Set runner
        id: set-runner
        run: |
          if [ "${{ inputs.arch }}" == "arm64" ]; then
            echo "runner=ubuntu24-arm64-4-16" >> $GITHUB_OUTPUT
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
          fi
      - name: Set matrix
        id: set-matrix
        run: |
          OS="${{ inputs.os }}"
          if [ -z "${OS}" ]; then
            if [ "${{ inputs.arch }}" == "arm64" ]; then
              OS="focal jammy rocky9 azurelinux3 amazonlinux2023 alpine noble resolute rocky8 rocky10 alma8 alma9 alma10 bullseye bookworm trixie mariner2"
            else
              OS="focal jammy rocky8 rocky9 bullseye amazonlinux2 amazonlinux2023 mariner2 azurelinux3 alpine noble resolute rocky10 alma8 alma9 alma10 bookworm trixie"
            fi
          fi
          MATRIX="["
          for os in $OS; do
            MATRIX="${MATRIX}{\"os\": \"${os}\"},"
          done
          MATRIX="${MATRIX%,}]"
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "Generated matrix for ${{ inputs.arch }}: ${MATRIX}"

  build-linux:
    name: ${{ inputs.arch }}-${{ matrix.platform.os }}, ${{ needs.setup-environment.outputs.redis-ref }}
    runs-on: ${{ needs.setup-environment.outputs.runner }}
    needs: setup-environment
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJson(needs.setup-environment.outputs.matrix) }}
    env:
      TAGGED: ${{ needs.setup-environment.outputs.TAGGED }}
      VERSION: ${{ needs.setup-environment.outputs.TAG }}
      BRANCH: ${{ needs.setup-environment.outputs.BRANCH }}
      TAG_OR_BRANCH: ${{ needs.setup-environment.outputs.TAG_OR_BRANCH }}
      REDIS_REF: ${{ needs.setup-environment.outputs.redis-ref }}
      IMAGE_ARCH: ${{ inputs.arch == 'x64' && 'x86' || 'arm' }}
      IMAGE_OS: ${{ inputs.run_sanitizer && format('{0}-sanitizer', matrix.platform.os) || matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'

      - name: Set Docker Image
        run: |
          repo="$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_tag="${REDIS_REF:-$(.install/get-redis-ref.sh)}"
          echo "DOCKER_IMAGE=ghcr.io/${repo}/redisbloom-${IMAGE_ARCH}-${IMAGE_OS}:${image_tag}" >> "$GITHUB_ENV"

      - name: Pull Docker Image
        id: pull-image
        if: ${{ inputs.use_prebuilt_images }}
        continue-on-error: true
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "::notice title=Docker image::Trying to pull prebuilt image ${DOCKER_IMAGE}"
          docker pull "${DOCKER_IMAGE}"

      - name: Use Pulled Docker Image
        if: ${{ inputs.use_prebuilt_images && steps.pull-image.outcome == 'success' }}
        run: |
          echo "::notice title=Docker image::Using pulled prebuilt image ${DOCKER_IMAGE}"

      - name: Build Docker Image
        if: ${{ !inputs.use_prebuilt_images || steps.pull-image.outcome == 'failure' }}
        run: |
          if [ "${{ steps.pull-image.outcome }}" = "failure" ]; then
            echo "::notice title=Docker image::Prebuilt image pull failed; building locally: ${DOCKER_IMAGE}"
          else
            echo "::notice title=Docker image::Building image locally because prebuilt images are disabled: ${DOCKER_IMAGE}"
          fi
          docker build \
            -f Dockerfile.${{ matrix.platform.os }} \
            --build-arg REDIS_REF=${{ env.REDIS_REF }} \
            --build-arg SANITIZER=${{ inputs.run_sanitizer && 'address' || '' }} \
            -t "${DOCKER_IMAGE}" \
            .

      - name: Build module
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e SAN=${{ inputs.run_sanitizer && 'addr' || '' }} \
            "${DOCKER_IMAGE}" \
            make build SAN=${{ inputs.run_sanitizer && 'addr' || '' }}

      - name: Run tests
        continue-on-error: true
        run: |
          echo "::error::Temporary forced test failure to expose S3 upload paths quickly."
          exit 1

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-artifacts-${{ inputs.arch }}-${{ matrix.platform.os }}
          path: |
            tests/**/logs/
            tests/**/*.log

      - name: Pack module
        if: ${{ !inputs.run_valgrind && !inputs.run_sanitizer }}
        env:
          BETA_VERSION: ${{ inputs.beta-version }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e BRANCH=${{ env.BRANCH }} \
            -e VERSION=${{ env.VERSION }} \
            -e TAGGED=${{ env.TAGGED }} \
            -e BETA_VERSION="${BETA_VERSION}" \
            "${DOCKER_IMAGE}" \
            bash -c "git config --global --add safe.directory /workspace && make pack BRANCH=${{ env.TAG_OR_BRANCH }} SHOW=1"

      - name: Upload artifacts to S3
        if: ${{ !inputs.run_valgrind && !inputs.run_sanitizer && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        env:
          BETA_VERSION: ${{ inputs.beta-version }}
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            -e AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            -e AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            -e GITHUB_REF=${{ github.ref }} \
            -e BETA_VERSION="${BETA_VERSION}" \
            "${DOCKER_IMAGE}" \
            bash -c "git config --global --add safe.directory /workspace && ./sbin/upload-artifacts-s3"
