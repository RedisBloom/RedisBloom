name: Test Summary

on:
  workflow_call:
    inputs:
      redis-ref:
        description: 'Redis ref that was tested'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-summary:
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Download all test results
        uses: actions/download-artifact@v4
        continue-on-error: true
      
      - name: Get commit information
        id: commit
        run: |
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=format:"%s" | head -c 100)
          echo "sha=$COMMIT_SHA" >> $GITHUB_OUTPUT
          echo "message=$COMMIT_MSG" >> $GITHUB_OUTPUT
          echo "Commit: $COMMIT_SHA - $COMMIT_MSG"
      
      - name: Aggregate test results
        id: aggregate
        run: |
          # Create summary JSON
          SUMMARY_FILE="test-summary.json"
          
          # Initialize arrays
          echo "[]" > "$SUMMARY_FILE"
          
          # Process all test result artifacts
          TOTAL_PASSED=0
          TOTAL_FAILED=0
          TOTAL_SKIPPED=0
          
          # Find all test result JSON files
          for result_file in test-results-*/test-results-*.json; do
            if [ -f "$result_file" ]; then
              echo "Processing: $result_file"
              # Extract OS name from path
              OS_NAME=$(basename "$result_file" .json | sed 's/test-results-//')
              
              # Read and add OS field if not present
              if command -v jq >/dev/null 2>&1; then
                # Add OS name if not present
                jq ". + {os: \"$OS_NAME\"}" "$result_file" > "${result_file}.tmp" && mv "${result_file}.tmp" "$result_file"
                
                # Add to summary array
                jq ". + [$(cat "$result_file")]" "$SUMMARY_FILE" > "${SUMMARY_FILE}.tmp" && mv "${SUMMARY_FILE}.tmp" "$SUMMARY_FILE"
                
                # Accumulate totals
                PASSED=$(jq -r '.passed // 0' "$result_file")
                FAILED=$(jq -r '.failed // 0' "$result_file")
                SKIPPED=$(jq -r '.skipped // 0' "$result_file")
                
                TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
                TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
                TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
              else
                # Fallback: use sed/awk if jq not available
                PASSED=$(grep -o '"passed":[0-9]*' "$result_file" | grep -o '[0-9]*' || echo "0")
                FAILED=$(grep -o '"failed":[0-9]*' "$result_file" | grep -o '[0-9]*' || echo "0")
                SKIPPED=$(grep -o '"skipped":[0-9]*' "$result_file" | grep -o '[0-9]*' || echo "0")
                
                TOTAL_PASSED=$((TOTAL_PASSED + PASSED))
                TOTAL_FAILED=$((TOTAL_FAILED + FAILED))
                TOTAL_SKIPPED=$((TOTAL_SKIPPED + SKIPPED))
              fi
            fi
          done
          
          # Output totals
          echo "total_passed=$TOTAL_PASSED" >> $GITHUB_OUTPUT
          echo "total_failed=$TOTAL_FAILED" >> $GITHUB_OUTPUT
          echo "total_skipped=$TOTAL_SKIPPED" >> $GITHUB_OUTPUT
          echo "summary_file=$SUMMARY_FILE" >> $GITHUB_OUTPUT
          
          echo "Summary: Passed=$TOTAL_PASSED, Failed=$TOTAL_FAILED, Skipped=$TOTAL_SKIPPED"
      
      - name: Format and send Slack message
        if: always()
        run: |
          # Read summary file
          SUMMARY_FILE="${{ steps.aggregate.outputs.summary_file }}"
          
          # Build message
          NIGHTLY_NAME="Event Nightly"
          REDIS_VERSION="${{ inputs.redis-ref }}"
          COMMIT_SHA="${{ steps.commit.outputs.sha }}"
          COMMIT_MSG="${{ steps.commit.outputs.message }}"
          WORKFLOW_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Title format: nightly name, Redis version, commit number and message
          TITLE="*${NIGHTLY_NAME}* | Redis: ${REDIS_VERSION} | Build: ${COMMIT_SHA} - ${COMMIT_MSG}"
          
          # Build per-OS summary
          PER_OS_SUMMARY=""
          
          if [ -f "$SUMMARY_FILE" ] && command -v jq >/dev/null 2>&1; then
            # Use jq to format per-OS results
            PER_OS_SUMMARY=$(jq -r '.[] | "• *\(.os // "unknown")*: ✅ Passed: \(.passed // 0) | ❌ Failed: \(.failed // 0) | ⏭️ Skipped: \(.skipped // 0)"' "$SUMMARY_FILE" | tr '\n' '\n')
          else
            # Fallback: simple text
            PER_OS_SUMMARY="Test results available. Check workflow for details."
          fi
          
          # Overall summary
          TOTAL_PASSED="${{ steps.aggregate.outputs.total_passed }}"
          TOTAL_FAILED="${{ steps.aggregate.outputs.total_failed }}"
          TOTAL_SKIPPED="${{ steps.aggregate.outputs.total_skipped }}"
          
          OVERALL_SUMMARY="*Overall Summary:*\n✅ Passed: ${TOTAL_PASSED} | ❌ Failed: ${TOTAL_FAILED} | ⏭️ Skipped: ${TOTAL_SKIPPED}"
          
          # Build full message text
          MESSAGE_TEXT="${TITLE}\n\n${OVERALL_SUMMARY}\n\n*Per-OS Results:*\n${PER_OS_SUMMARY}\n\n<${WORKFLOW_URL}|View Workflow Run>"
          
          # Build Slack payload with blocks
          # Escape special characters for JSON
          COMMIT_MSG_ESC=$(echo "$COMMIT_MSG" | sed 's/"/\\"/g' | sed 's/\\/\\\\/g')
          PER_OS_SUMMARY_ESC=$(echo "$PER_OS_SUMMARY" | sed 's/"/\\"/g' | sed 's/\\/\\\\/g')
          
          PAYLOAD=$(cat <<'PAYLOAD_EOF'
{
  "text": "Event Nightly Test Results",
  "blocks": [
    {
      "type": "header",
      "text": {
        "type": "plain_text",
        "text": "Event Nightly"
      }
    },
    {
      "type": "section",
      "fields": [
        {
          "type": "mrkdwn",
          "text": "*Redis Version:*\nREDIS_VERSION_PLACEHOLDER"
        },
        {
          "type": "mrkdwn",
          "text": "*Build:*\nCOMMIT_SHA_PLACEHOLDER"
        }
      ]
    },
    {
      "type": "section",
      "text": {
        "type": "mrkdwn",
        "text": "*Commit:* COMMIT_MSG_PLACEHOLDER"
      }
    },
    {
      "type": "divider"
    },
    {
      "type": "section",
      "text": {
        "type": "mrkdwn",
        "text": "*Overall Summary*\n✅ Passed: TOTAL_PASSED_PLACEHOLDER | ❌ Failed: TOTAL_FAILED_PLACEHOLDER | ⏭️ Skipped: TOTAL_SKIPPED_PLACEHOLDER"
      }
    },
    {
      "type": "divider"
    },
    {
      "type": "section",
      "text": {
        "type": "mrkdwn",
        "text": "*Per-OS Results*\nPER_OS_SUMMARY_PLACEHOLDER"
      }
    },
    {
      "type": "section",
      "text": {
        "type": "mrkdwn",
        "text": "<WORKFLOW_URL_PLACEHOLDER|View Workflow Run>"
      }
    }
  ]
}
PAYLOAD_EOF
          )
          
          # Replace placeholders
          PAYLOAD=$(echo "$PAYLOAD" | sed "s/REDIS_VERSION_PLACEHOLDER/${REDIS_VERSION}/g" | \
            sed "s/COMMIT_SHA_PLACEHOLDER/${COMMIT_SHA}/g" | \
            sed "s/COMMIT_MSG_PLACEHOLDER/${COMMIT_MSG_ESC}/g" | \
            sed "s/TOTAL_PASSED_PLACEHOLDER/${TOTAL_PASSED}/g" | \
            sed "s/TOTAL_FAILED_PLACEHOLDER/${TOTAL_FAILED}/g" | \
            sed "s/TOTAL_SKIPPED_PLACEHOLDER/${TOTAL_SKIPPED}/g" | \
            sed "s|PER_OS_SUMMARY_PLACEHOLDER|${PER_OS_SUMMARY_ESC}|g" | \
            sed "s|WORKFLOW_URL_PLACEHOLDER|${WORKFLOW_URL}|g")
          
          # Send to Slack
          WEBHOOK_URL="${{ secrets.DATATYPES_SLACK_WEBHOOK_URL }}"
          if [ -n "$WEBHOOK_URL" ] && [ "$WEBHOOK_URL" != "" ]; then
            curl -X POST -H 'Content-type: application/json' \
              --data "$PAYLOAD" \
              "$WEBHOOK_URL"
            echo "Slack message sent successfully"
          else
            echo "DATATYPES_SLACK_WEBHOOK_URL secret not set. Message would be:"
            echo "$MESSAGE_TEXT"
          fi

